# environment.yml — reproducible conda environment for the Rosetta + ML project
#
#   Create:  conda env create -f environment.yml
#   Update:  conda env update -f environment.yml --prune
#   Remove:  conda env remove -n rosetta-ml
#
# NOTE ON PyRosetta: it is intentionally NOT listed here.
#   - Its wheels are date-stamped (rebuilt quarterly), so it can't be pinned cleanly.
#   - The conda channel needs private credentials you must never commit to Git.
#   Install it AFTER creating this env — see the README ("Step 5: Install PyRosetta").

name: rosetta-ml

channels:
  - conda-forge          # free, community channel (avoids Anaconda's paid "defaults")

dependencies:
  - python=3.10
  - pytorch-cpu          # CPU-only build of PyTorch from conda-forge
  - numpy
  - scipy
  - matplotlib
  - pip

  # ---- optional but handy in a lab; delete the block if you don't want them ----
  # - torchvision-cpu
  # - jupyterlab
  # - ipykernel
  # - pandas
