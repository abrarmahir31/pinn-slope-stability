# torch is intentionally NOT listed here.
#   Laptop:  pip install torch --index-url https://download.pytorch.org/whl/cpu
#   Lab PC:  pip install torch --index-url https://download.pytorch.org/whl/cu130
# See tools/gpu_check.py. Do not add torch to this file - the two machines
# need different builds and conda would drag in its own cudatoolkit.
name: pinn
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy
  - scipy
  - matplotlib
  - pandas
  - pymupdf
  - pillow
  - pytest
  - pip
  - pip:
    - rosetta-soil==0.1.2
